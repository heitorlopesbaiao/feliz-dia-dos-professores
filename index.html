<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feliz Dia dos Professores</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#a52a2a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    background:white;
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
    color:#2E8B57;
    margin-bottom:20px;
}

p{
    color:#444;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    font-size:18px;
    border:2px solid #2E8B57;
    border-radius:10px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#2E8B57;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#256b44;
}

</style>

</head>

<body>

<div class="container">

<h1> Feliz Dia dos Professores </h1>

<p>
Digite o código para abrir sua homenagem.
</p>

<input
type="password"
id="codigo"
placeholder="Digite seu código">


<button type="button" id="btnMostrar" onclick="mostrarSenha()">
👁 Mostrar código
</button>


<button onclick="entrar()">
Abrir homenagem
</button>


</div>


<script>

function mostrarSenha(){

    let campo = document.getElementById("codigo");
    let botao = document.getElementById("btnMostrar");

    if(campo.type === "password"){
        campo.type = "text";
        botao.innerHTML = "🙈 Ocultar código";
    }
    else{
        campo.type = "password";
        botao.innerHTML = "👁 Mostrar código";
    }

}


function entrar(){

    let codigo = document.getElementById("codigo").value.toUpperCase().trim();


    if(codigo === "S8K2"){
        window.location.href = "S8K2.html";
    }

    else if(codigo === "Y5M2"){
        window.location.href = "Y5M2.html";
    }

    else if(codigo === "U8E4"){
        window.location.href = "U8E4.html";
    }

    else if (codigo === "K2I6") {
        window.location.href = "K2I6.html";
    }

    else if (codigo === "J6P8") {
        window.location.href = "J6P8.html";
    }

    else if (codigo === "P3T9") {
        window.location.href = "P3T9.html";
    }

    else if (codigo === "F7S1") {
        window.location.href = "F7S1.html";
    }

    else if (codigo === "C9L3") {
        window.location.href = "C9L3.html";
    }

    else if (codigo === "A4N5") {
        window.location.href = "A4N5.html";
    }

    else if (codigo === "R4G7") {
        window.location.href = "R4G7.html";
    }

    else{
        alert("Código inválido.");
    }

}

</script>

</body>
</html>
